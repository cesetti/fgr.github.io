<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fernando Gruttadauria · Cesetti Comunicaciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --red: #CC1818;
      --red2: #CC2020;
      --bg: #F5F5F7;
      --card: #FFFFFF;
      --text: #1A1A2E;
      --text2: #555566;
      --border: #E8E8F0;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.10);
      overflow: hidden;
    }

    /* HEADER */
    .header {
      background: #ffffff; border-bottom: 2px solid #F0F0F5;
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo-centered {
      width: 120px;
      height: auto;
      display: block;
      /* logo tiene fondo blanco - mostramos con pequeño radio */
      border-radius: 8px;
    }
    .header-row {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
    }
    .photo-circle {
      flex-shrink: 0;
      width: 88px;
    }
    .photo-circle img {
      width: 88px; height: auto;
      display: block;
    }
    .header-info {
      flex: 1;
    }
    .name {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.3px;
      line-height: 1.2;
    }
    .role {
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      margin-top: 3px;
    }
    .company {
      font-size: 12px;
      color: var(--red);
      font-weight: 600;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .location-line {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 6px;
      color: var(--text2);
      font-size: 12px;
    }

    /* BODY */
    .body { padding: 20px 20px 0; }
    .info-list { display: flex; flex-direction: column; gap: 2px; }
    .info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      transition: background .15s;
      border-radius: 6px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: #F0F0F8;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }
    .info-content { flex: 1; min-width: 0; }
    .info-label { font-size: 11px; color: var(--text2); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    .info-value { font-size: 14px; color: var(--text); font-weight: 600; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ESPECIALIDADES */
    .section { padding: 16px 20px 0; }
    .section-title { font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      background: #F0F0F8;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    /* ACTIONS */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 20px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(0.97); opacity: 0.85; }
    .btn-primary { background: var(--red); color: white; }
    .btn-secondary { background: #F0F0F8; color: var(--text); border: 1px solid var(--border); }
    .btn-whatsapp { background: #25D366; color: white; }
    .btn-linkedin { background: #0A66C2; color: white; grid-column: 1 / -1; }

    /* QR */
    .qr-section {
      margin: 0 20px 20px;
      background: #F8F8FC;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--border);
    }
    .qr-toggle {
      width: 100%;
      background: none;
      border: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      padding: 0;
    }
    .qr-body { display: none; margin-top: 14px; text-align: center; }
    .qr-body.open { display: block; }
    #qr-input {
      width: 100%; padding: 8px 12px; border-radius: 10px;
      border: 1px solid var(--border); font-family: inherit;
      font-size: 13px; margin-bottom: 10px; color: var(--text);
    }
    #qr-output { display: flex; justify-content: center; }
    #qr-output canvas, #qr-output img { border-radius: 8px; }
  </style>
</head>
